name: Crawl for derivative works

on:
  schedule:
    # Every Monday at 13:00 UTC. Adjust as you like (cron is UTC).
    - cron: "0 13 * * 1"
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
    inputs:
      date_from:
        description: "Historical scan: only include results published on/after this date (YYYY-MM-DD). Leave blank for no lower bound."
        required: false
        type: string
      date_to:
        description: "Historical scan: only include results published on/before this date (YYYY-MM-DD). Leave blank for no upper bound (today)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run crawler
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          # Only present on a manual "Run workflow" dispatch with those
          # fields filled in -- empty (not an error) on the regular
          # schedule trigger, which always searches with no date
          # restriction (today/most-recent, the existing default).
          DATE_FROM: ${{ github.event.inputs.date_from }}
          DATE_TO: ${{ github.event.inputs.date_to }}
        run: python crawler/search_and_log.py

      - name: Identify attribution via the OWASP GenAI Security Project MCP server
        run: python crawler/attribute.py

      - name: Commit updated candidates
        run: |
          git config user.name "gsp-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json data/translation_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Crawler: update candidate derivative works ($(date -u +%Y-%m-%d))"
            git push
          fi
