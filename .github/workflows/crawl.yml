name: Crawl for derivative works

on:
  schedule:
    # Every Monday at 13:00 UTC. Adjust as you like (cron is UTC).
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run crawler
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python crawler/search_and_log.py

      - name: Commit updated candidates
        run: |
          git config user.name "gsp-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json data/translation_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Crawler: update candidate derivative works ($(date -u +%Y-%m-%d))"
            git push
          fi
