# Crawler configuration
#
# Add one search query per GSP resource you want to track. Be specific —
# exact titles of guides, cheat sheets, or frameworks work far better than
# generic terms like "OWASP GenAI", which will mostly return noise.
#
# Standard Google search operators work here, e.g. quotes for exact phrases,
# "-word" to exclude, "site:" / "-site:" to include or exclude domains --
# these reach real google.com results via SerpAPI's `google` sub-engine
# below, not Google's own Custom Search API (see note below).

# Which search backends to run each query against. Each needs its own API
# key set as an environment variable (locally) or GitHub Actions secret.
#   serpapi     -> SERPAPI_KEY   (Google + Bing + DuckDuckGo -- see
#                                 serpapi_engines below. Google's own Custom
#                                 Search API was dropped as an engine here:
#                                 as of 2025 its free/standard tier only
#                                 searches domains you explicitly configure,
#                                 not the open web, so it can't do what this
#                                 crawler needs -- broad, unrestricted google.com
#                                 results now come from SerpAPI's `google`
#                                 sub-engine instead, reusing the same key.)
#   perplexity  -> PERPLEXITY_API_KEY   (AI answer engine, cites sources)
# Comment out any engine you haven't set up yet.
engines:
  - serpapi
  - perplexity

# Which SerpAPI sub-engines to query (only used if serpapi is enabled above).
# `google` gives real unrestricted google.com results (replaces the old
# google_cse engine, which Google's Custom Search API can no longer do).
# Narrowed to just `google` to fit SerpAPI's 100 searches/month free tier --
# each sub-engine here multiplies every query. Add bing/duckduckgo back if
# you upgrade the plan.
serpapi_engines:
  - google

# Perplexity model to use (only used if perplexity is enabled above).
perplexity_model: sonar

results_per_query: 10

# ---------------------------------------------------------------------------
# Multilingual / multi-region search
# ---------------------------------------------------------------------------
# Each entry biases search results toward that language/country using the
# engines' own locale parameters (Google's lr/gl, SerpAPI's hl/gl). Resource
# titles are searched as-is (quoted) in every language, since proper nouns
# like your resource names are usually kept in English even in foreign-
# language content.
#
# Set translate_modifiers: true to also translate a short list of generic
# terms (below) into each enabled language and OR them into the query — this
# catches informal/paraphrased mentions, not just exact-title hits. Requires
# GOOGLE_TRANSLATE_API_KEY (see crawler/SETUP.md).
#
# COST WARNING: every enabled language roughly multiplies your total query
# count (languages × resource titles × engines). Free tiers are small
# (Google CSE: 100/day, SerpAPI: 100/month). Start with a few languages,
# check your usage, then expand. Toggle with `enabled: true/false` below.

translate_modifiers: false
modifier_terms:
  - presentation
  - training course
  - conference session
  - marketing brochure
  - article

languages:
  # --- Baseline ---
  - { code: en, country: US, region: "English (default)",  label: "English (US)",        enabled: true }

  # --- Europe ---
  # Disabled to fit SerpAPI's free tier (100 searches/month) -- each
  # enabled language multiplies Pass 1's query count. Re-enable once on a
  # paid plan; see the cost note above.
  - { code: es, country: ES, region: Europe, label: "Spanish (Spain)",     enabled: false }
  - { code: fr, country: FR, region: Europe, label: "French",              enabled: false }
  - { code: de, country: DE, region: Europe, label: "German",              enabled: false }
  - { code: it, country: IT, region: Europe, label: "Italian",             enabled: false }
  - { code: pt, country: PT, region: Europe, label: "Portuguese (Portugal)", enabled: false }
  - { code: nl, country: NL, region: Europe, label: "Dutch",               enabled: false }
  - { code: pl, country: PL, region: Europe, label: "Polish",              enabled: false }
  - { code: ru, country: RU, region: Europe, label: "Russian",             enabled: false }

  # --- Japan ---
  - { code: ja, country: JP, region: Japan, label: "Japanese",             enabled: false }

  # --- China ---
  - { code: zh-CN, country: CN, region: China, label: "Chinese (Simplified)",  enabled: false }
  - { code: zh-TW, country: TW, region: China, label: "Chinese (Traditional)", enabled: false }

  # --- India ---
  - { code: hi, country: IN, region: India, label: "Hindi",                enabled: false }
  - { code: en, country: IN, region: India, label: "English (India)",      enabled: false }

  # --- South America ---
  - { code: pt, country: BR, region: "South America", label: "Portuguese (Brazil)",   enabled: false }
  - { code: es, country: AR, region: "South America", label: "Spanish (Argentina)",   enabled: false }
  - { code: es, country: MX, region: "South America", label: "Spanish (Mexico)",      enabled: false }
  - { code: es, country: CO, region: "South America", label: "Spanish (Colombia)",    enabled: false }

  # --- Other Asia ---
  - { code: ko, country: KR, region: "Other Asia", label: "Korean",     enabled: false }
  - { code: vi, country: VN, region: "Other Asia", label: "Vietnamese", enabled: false }
  - { code: th, country: TH, region: "Other Asia", label: "Thai",       enabled: false }
  - { code: id, country: ID, region: "Other Asia", label: "Indonesian", enabled: false }

# ---------------------------------------------------------------------------
# Conference & association discovery
# ---------------------------------------------------------------------------
# A second, separate search pass: for each resource title, query alongside
# named conferences, vendor user conferences, training events, and industry
# associations — e.g. "OWASP Top 10 for LLM Applications" "RSA Conference".
# This does NOT multiply by the languages list above (conference names are
# proper nouns, same logic as resource titles) — it's a flat
# titles × conference-names × engines pass, controlled separately here.
#
# COST WARNING: with the defaults below (~35 names) this is roughly 35×
# your resource title count, per SerpAPI sub-engine enabled. With 18
# resource titles that's ~1,890 searches/run alone -- by far the single
# biggest cost driver (roughly 81% of total query volume) -- so this pass
# is disabled below to fit SerpAPI's 100 searches/month free tier. Re-enable
# once on a paid plan, or narrow it (fewer names/categories, or scope
# `engines:` down before flipping `enabled: true`).

conference_search:
  enabled: false
  engines:
    - serpapi
  results_per_query: 10

  categories:
    cybersecurity_conferences:
      enabled: true
      default_type: "Conference session"
      names:
        - "RSA Conference"
        - "Black Hat"
        - "DEF CON"
        - "BSides"
        - "Infosecurity Europe"
        - "OWASP AppSec"
        - "Gartner Security & Risk Management Summit"
        - "ShmooCon"
        - "CactusCon"

    ai_conferences:
      enabled: true
      default_type: "Conference session"
      names:
        - "NeurIPS"
        - "ICML"
        - "AI Village DEF CON"
        - "Applied Machine Learning Days"
        - "Gartner Data & Analytics Summit"
        - "O'Reilly AI Conference"

    vendor_user_conferences:
      enabled: true
      default_type: "Conference session"
      names:
        - "AWS re:Inforce"
        - "AWS re:Invent"
        - "Microsoft Ignite"
        - "Google Cloud Next"
        - "Cisco Live"
        - "Splunk .conf"
        - "Salesforce Dreamforce"
        - "ServiceNow Knowledge"
        - "Palo Alto Networks Ignite"
        - "CrowdStrike Fal.Con"

    training_conferences:
      enabled: true
      default_type: "Training class"
      names:
        - "SANS Training"
        - "ISC2 Security Congress"
        - "ISACA Training Week"
        - "Black Hat Training"

    industry_associations:
      enabled: true
      default_type: "Conference session"
      names:
        - "ISACA"
        - "ISC2"
        - "Cloud Security Alliance"
        - "IAPP"
        - "IEEE Security and Privacy"
        - "ACM CCS"

queries:
  # Sourced from genai.owasp.org/resources/, genai.owasp.org/llm-top-10/,
  # genai.owasp.org, and github.com/genai-security-project repos, reviewed
  # 2026-08-16. Quarter/year suffixes deliberately dropped from recurring
  # reports (e.g. "Q2 2026") -- a reuse/citation is more likely to drop the
  # quarter than keep it, so the family name should catch more real matches.

  # --- Flagship Top 10 documents (highest-value) ---
  - "\"OWASP Top 10 for LLM Applications\" -site:owasp.org"
  - "\"OWASP GenAI LLM Top 10\""
  - "\"OWASP Top 10 for LLM Applications\" \"2023\""
  - "\"OWASP Top 10 for Agentic Applications\""

  # --- Other major named guides/reports ---
  - "\"OWASP GenAI Data Security Risks and Mitigations\""
  - "\"A Practical Guide for Secure MCP Server Development\""
  - "\"A Practical Guide for Securely Using Third-Party MCP Servers\""
  - "\"OWASP GenAI Security Project\" \"Threat Defense COMPASS\""
  - "\"State of Agentic AI Security and Governance\""
  - "\"AI Security Solutions Landscape\" \"Agentic AI\""
  - "\"AI Security Solutions Landscape\" \"LLM and Gen AI\""
  - "\"OWASP Vendor Evaluation Criteria\" \"AI Red Teaming\""
  - "\"OWASP Guide to Preparing and Responding to Deepfake Events\""
  - "\"OWASP GenAI Exploit Round-up Report\""
  - "\"OWASP Gen AI\" \"Agentic Security Top 10\" presentation"

  # --- Tools/repos (code reuse, not just document mentions) ---
  - "\"OWASP AIBOM Generator\""
  - "\"FinBot\" \"Capture The Flag\" OWASP"
  - "\"GenAI Security Advisor\" OWASP"

# Domains to always ignore (official channels + noisy aggregators).
# Matches the domain itself and any subdomain.
excluded_domains:
  - genai.owasp.org
  - owasp.org
  - youtube.com
  - youtu.be
  - linkedin.com
  - twitter.com
  - x.com
  - facebook.com
